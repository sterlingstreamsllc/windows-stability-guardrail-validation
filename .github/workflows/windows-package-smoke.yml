name: Frozen package smoke (one approved attempt)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type PACKAGE-ONLY-ONE-RUN; unchanged baseline required; any capacity refusal is FAIL'
        required: true
        type: string
      reviewed_commit:
        description: 'Exact independently reviewed 40-character main commit, including frozen ZIP'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pcsg-package-0.1.2-pkg.1
  cancel-in-progress: false
jobs:
  package:
    if: >-
      github.repository == 'sterlingstreamsllc/windows-stability-guardrail-validation' &&
      github.event.repository.id == 1428899604 &&
      github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/main' &&
      inputs.approval == 'PACKAGE-ONLY-ONE-RUN' && inputs.reviewed_commit == github.sha
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -File "{0}"
    env:
      PCSG_REPOSITORY_ID: ${{ github.event.repository.id }}
      PCSG_PRIVATE: ${{ github.event.repository.private }}
      PCSG_APPROVAL: ${{ inputs.approval }}
      PCSG_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
    steps:
      - name: Initialize bounded evidence before checkout
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP ('pcsg-package-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $dir) { throw 'EVIDENCE_DIRECTORY_EXISTS_NO_OVERWRITE' }
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          @{status='INCOMPLETE';phase='before-checkout';commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;image=$env:ImageVersion;image_os=$env:ImageOS;production='DISABLED'} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dir 'bootstrap.json') -Encoding UTF8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verified official action.yml
        with:
          ref: ${{ inputs.reviewed_commit }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          clean: false
          set-safe-directory: false
      - name: Parse and execute the bounded package harness once
        timeout-minutes: 7
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP ('pcsg-package-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $path = Join-Path $env:GITHUB_WORKSPACE 'ci\package-smoke.ps1'
          $tokens=$null; $errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          @{phase='harness-parse';sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash;errors=@($errors | ForEach-Object {$_.ToString()});tokens=@($tokens).Count} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $dir 'bootstrap-parse.json') -Encoding UTF8
          if (@($errors).Count -ne 0) { throw 'HARNESS_PARSE_FAILURE_NO_EXECUTION' }
          # Compile only the reviewed finite owner helper, using the runner's
          # existing Framework64 compiler. No install, analyzer, response file,
          # package change, runtime upgrade or repeated build is permitted.
          if (-not [Environment]::Is64BitProcess) { throw 'X64_POWERSHELL_REQUIRED' }
          $source=Join-Path $env:GITHUB_WORKSPACE 'ci\OwnedCommand.cs'
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $framework=Split-Path -Parent $compiler
          $assembly=Join-Path $env:RUNNER_TEMP ('pcsg-owner-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.dll')
          if (Test-Path -LiteralPath $assembly) { throw 'OWNER_ASSEMBLY_EXISTS_NO_OVERWRITE' }
          if ((Get-Item -LiteralPath $source).Length -gt 32768) { throw 'OWNER_SOURCE_BOUND' }
          $stdout=Join-Path $dir 'owner-build-stdout.txt'; $stderr=Join-Path $dir 'owner-build-stderr.txt'
          $build=@{status='INCOMPLETE';source_sha256=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash;compiler=$compiler;compiler_sha256=(Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash;compiler_version=(Get-Item -LiteralPath $compiler).VersionInfo.FileVersion;assembly_sha256=$null;exit_code=$null;timeout=$false;cleanup_error=$null}
          $p=$null; $failure=$null
          try {
            $arguments='/noconfig /nologo /target:library /platform:x64 /out:"'+$assembly+'" /reference:"'+(Join-Path $framework 'System.dll')+'" "'+$source+'"'
            $p=Start-Process -FilePath $compiler -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $null=$p.Handle
            if (-not $p.WaitForExit(30000)) { $build.timeout=$true; throw 'OWNER_COMPILER_DEADLINE' }
            $build.exit_code=$p.ExitCode
            if ($p.ExitCode -ne 0) { throw 'OWNER_COMPILATION_FAILED' }
            if ((Get-Item -LiteralPath $stdout).Length -gt 65536 -or (Get-Item -LiteralPath $stderr).Length -gt 65536) { throw 'OWNER_COMPILER_OUTPUT_BOUND' }
            if ((Get-Item -LiteralPath $assembly).Length -gt 262144) { throw 'OWNER_ASSEMBLY_BOUND' }
            $build.assembly_sha256=(Get-FileHash -LiteralPath $assembly -Algorithm SHA256).Hash
            Add-Type -Path $assembly -ErrorAction Stop
            $build.status='COMPILED_AND_LOADED'
          } catch { $failure=$_; $build.status='FAIL'; $build.failure=$_.ToString() }
          finally {
            if ($null -ne $p) {
              try {
                if (-not $p.WaitForExit(0)) { $p.Kill(); if (-not $p.WaitForExit(3000)) { throw 'OWNED_COMPILER_EXIT_UNCONFIRMED' } }
              } catch { $build.status='FAIL'; $build.cleanup_error=$_.ToString(); if ($null -eq $failure) { $failure=$_ } }
              finally {
                try { $p.Dispose() }
                catch { $build.status='FAIL'; $build.dispose_error=$_.ToString(); if ($null -eq $failure) { $failure=$_ } }
              }
            }
            if ($null -ne $failure) { $build.status='FAIL'; $build.failure=$failure.ToString() }
            try {
              $build | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $dir 'owner-build.json') -Encoding UTF8
            } catch {
              $build.status='FAIL'; $build.receipt_error=$_.ToString()
              if ($null -eq $failure) { $failure=$_ }
              # Preserve the first ErrorRecord even if receipt or console I/O fails.
              try {
                $diagnostic='OWNER_BUILD_RECEIPT_WRITE_FAILED; first='+$failure.ToString()+'; receipt='+$build.receipt_error
                [Console]::Error.WriteLine($diagnostic.Substring(0,[Math]::Min(4096,$diagnostic.Length)))
              } catch { $build.diagnostic_error=$_.ToString() }
            }
          }
          if ($null -ne $failure) { throw $failure }
          & $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Finalize job evidence without changing the test result
        if: always()
        env:
          PCSG_JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('pcsg-package-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $dir) {
            $target=Join-Path $dir 'workflow-final.json'
            if (Test-Path -LiteralPath $target) { throw 'FINAL_RECEIPT_EXISTS' }
            @{status=$env:PCSG_JOB_STATUS;commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;image=$env:ImageVersion;package_sha256='a6a7a8a698819c0d0cde2e36dfe86e2afd256db26668315f616cec533c384310';expected_capacity_refusal_is='FAIL';production='DISABLED'} | ConvertTo-Json | Set-Content -LiteralPath $target -Encoding UTF8
          }
      - name: Bound evidence artifact
        id: evidence_bound
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('pcsg-package-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if (-not (Test-Path -LiteralPath $dir)) { throw 'EVIDENCE_DIRECTORY_MISSING' }
          if (((Get-Item -LiteralPath $dir).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'EVIDENCE_REPARSE' }
          [long]$bytes=0; $count=0
          foreach ($path in [IO.Directory]::EnumerateFileSystemEntries($dir)) {
            $item=Get-Item -LiteralPath $path
            $count++
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $item.Length -gt 1MB -or $count -gt 512) { throw 'EVIDENCE_BOUND_FAILURE' }
            $bytes+=$item.Length
            if ($bytes -gt 32MB) { throw 'EVIDENCE_TOTAL_BOUND_FAILURE' }
          }
          'ok=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; verified official action.yml
        if: always() && steps.evidence_bound.outputs.ok == 'true'
        with:
          name: pcsg-package-0.1.2-pkg.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pcsg-package-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Upload bounded control receipts if full evidence fails its bound
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.evidence_bound.outputs.ok != 'true'
        with:
          name: pcsg-package-partial-0.1.2-pkg.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pcsg-package-${{ github.run_id }}-${{ github.run_attempt }}/bootstrap.json
            ${{ runner.temp }}/pcsg-package-${{ github.run_id }}-${{ github.run_attempt }}/bootstrap-parse.json
            ${{ runner.temp }}/pcsg-package-${{ github.run_id }}-${{ github.run_attempt }}/owner-build.json
            ${{ runner.temp }}/pcsg-package-${{ github.run_id }}-${{ github.run_attempt }}/workflow-final.json
            ${{ runner.temp }}/pcsg-package-${{ github.run_id }}-${{ github.run_attempt }}/final.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false
